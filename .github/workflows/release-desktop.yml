name: Release desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build DMG
        run: ./mac/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: mac/dist/RewriteBetter-*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Build installer
        working-directory: win
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="$(node ../scripts/release-version.js)"
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Set the TAURI_SIGNING_PRIVATE_KEY repository secret so Windows updates can be signed." >&2
            exit 1
          fi
          npm ci
          npx tauri build --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          TAG="${GITHUB_REF_TYPE:-}"
          if [[ "$TAG" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${VERSION}"
          fi
          node ../scripts/windows-updater-manifest.js \
            --dir src-tauri/target/release/bundle/nsis \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}"
      - uses: actions/upload-artifact@v4
        with:
          name: win-setup
          path: |
            win/src-tauri/target/release/bundle/nsis/*.exe
            win/src-tauri/target/release/bundle/nsis/*.sig
            win/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

  release:
    needs: [macos, windows]
    if: always() && (needs.macos.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(artifacts/**/*.dmg artifacts/**/*.exe artifacts/**/*.sig artifacts/**/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No desktop artifacts to publish" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v1.0.0"
          fi
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$tag" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Rewrite Better ${tag#v}" \
              --generate-notes \
              --latest
          fi
          version="${tag#v}"
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            if [[ "$name" == *.dmg || "$name" == *.exe ]] && [[ "$name" != *"$version"* ]]; then
              gh release delete-asset "$tag" "$name" --yes --repo "${GITHUB_REPOSITORY}"
            fi
          done < <(gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
      - name: Update Homebrew cask
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0"
          fi
          dmg=(artifacts/**/RewriteBetter-"${version}".dmg)
          if [[ ! -f "${dmg[0]:-}" ]]; then
            echo "No Mac DMG for ${version}; Homebrew cask unchanged."
            exit 0
          fi
          if [[ -z "${HOMEBREW_TAP_SSH_KEY}" ]]; then
            echo "Set the HOMEBREW_TAP_SSH_KEY repository secret so the Homebrew cask stays current." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_SSH_KEY" > ~/.ssh/homebrew_tap
          chmod 600 ~/.ssh/homebrew_tap
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/homebrew_tap -o IdentitiesOnly=yes"
          git clone git@github.com:cvthang56th2/homebrew-rewrite-better.git tap
          node scripts/homebrew-cask.js \
            --version "$version" \
            --dmg "${dmg[0]}" \
            --out tap/Casks/rewrite-better.rb
          git -C tap add Casks/rewrite-better.rb
          if git -C tap diff --cached --quiet; then
            echo "Homebrew cask already matches ${version}."
            exit 0
          fi
          git -C tap -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update Rewrite Better to ${version}"
          git -C tap push
