[package]
name = "rewrite-better"
version = "1.0.0"
description = "Rewrite Better for Windows"
authors = ["Rewrite Better"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rewrite_better_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# keyring 3 has no default stores — without windows-native, it uses a mock
# that does not persist (save then get returns empty → "API key is not configured").
keyring = { version = "3", features = ["windows-native"] }
arboard = "3"
enigo = "0.3"
reqwest = { version = "0.12", features = ["json"] }
